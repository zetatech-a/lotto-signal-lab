[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lotto-signal-lab"
version = "0.2.0"
description = "Reproducible Lotto 6/45 data collection, statistics, walk-forward backtesting, and recommendation experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
lotto-lab = "lotto_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lotto_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
